<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffc2d6">
  <title>NVSU Clinic | Medicine Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- shared shine gradient used by the medicine drawings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
        <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".12"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- PC only: side menu -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <!-- PC only: top bar -->
      <header class="deskbar" id="deskbar"></header>
      <div class="view" id="view"></div>
    </div>

    <!-- Phone only: bottom menu -->
    <nav class="bottom-nav" id="nav" aria-label="Main"></nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-box" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="slip"></div>

  <script src="app.js"></script>
</body>
</html>
